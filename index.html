<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/output.css">
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <meta property="og:title" content="こねこジャンケン">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wild-river.github.io/kadai01_janken/">
  <meta property="og:image" content="https://wild-river.github.io/kadai01_janken/img/ogp.jpg">
  <meta property="og:site_name" content="こねこジャンケン">
  <meta property="og:description" content="こねこと一緒にジャンケンするゲームです。足跡を10個集めたら、こねこからプレゼントがもらえるよ！">
  <meta property="og:locale" content="ja_JP">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <title>こねこジャンケン</title>
</head>

<body class="zen-maru-gothic-regular">
  <main id="main" class="h-dvh flex items-center justify-center">
    <!-- ヘルプボタン -->
    <button id="help-btn"
      class="fixed top-4 right-4 w-10 h-10 rounded-full bg-yellow-400 text-white font-bold text-xl z-50 hover:opacity-80"><svg
        xmlns="http://www.w3.org/2000/svg" width="40" height="40"
        viewBox="0 0 12 12"><!-- Icon from Qlementine Icons by Olivier Cléro - https://github.com/oclero/qlementine-icons/blob/master/LICENSE -->
        <path fill="currentColor"
          d="M5.82 3c-.328 0-.61.15-.74.508c-.094.26-.299.492-.575.492s-.5-.172-.5-.498c0-.825.946-1.5 1.82-1.5c1.19 0 2.04 1.12 1.76 2.26a1.83 1.83 0 0 1-.48.849l-.448.448a.5.5 0 0 0-.146.354v.586a.5.5 0 0 1-1 0v-.586c0-.398.158-.779.439-1.06l.448-.448a.82.82 0 0 0-.572-1.404zm.93 5.75a.75.75 0 1 1-1.5 0a.75.75 0 0 1 1.5 0" />
      </svg></button>
    <div id="help-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center"
      style="display:none!important">
      <div class="bg-white rounded-2xl p-6 mx-4 max-w-sm w-full">
        <h2 class="text-2xl font-bold text-center mb-4">もちものの使いかた</h2>
        <ul class="space-y-4 text-base">
          <li class="flex items-center gap-3">
            <img src="img/nekokan.webp" alt="ねこのかんづめ" class="w-20 rounded-lg object-cover">
            <div>
              <p class="text-lg font-bold leading-relaxed mb-2">ねこのかんづめ</p>こねこが元気になる。次は勝った時に<span
                class="font-bold">【足跡が2倍】</span>もらえる！
            </div>
          </li>
          <li class="flex items-center gap-3">
            <img src="img/churu.webp" alt="ちゅーる" class="w-20 rounded-lg object-cover">
            <div>
              <p class="text-lg font-bold leading-relaxed mb-2">ちゅーる</p>こねこが喜んで勝負にならない。次は<span
                class="font-bold">【必ず勝てる】</span>
            </div>
          </li>
          <li class="flex items-center gap-3">
            <img src="img/toy.webp" alt="ねこじゃらし" class="w-20 rounded-lg object-cover">
            <div>
              <p class="text-lg font-bold leading-relaxed mb-2">ねこじゃらし</p>こねこが本気になる。次はあいこにならず<span
                class="font-bold">【必ず勝敗が決まる】</span>
            </div>
          </li>
        </ul>
        <div class="text-center mt-6">
          <button id="help-close" class="text-xl btn-square mx-auto">とじる</button>
        </div>
      </div>
    </div>
    <!-- ミュート -->
    <button id="mute-btn"
      class="fixed top-4 right-16 w-10 h-10 rounded-full bg-yellow-400 text-white font-bold z-50 flex items-center justify-center">
      <!-- ON用SVG -->
      <svg id="icon-volume-on" xmlns="http://www.w3.org/2000/svg" width="28" height="28"
        viewBox="0 0 20 20"><!-- Icon from HeroIcons v1 Solid by Refactoring UI Inc - https://github.com/tailwindlabs/heroicons/blob/master/LICENSE -->
        <path fill="currentColor" fill-rule="evenodd"
          d="M9.383 3.076A1 1 0 0 1 10 4v12a1 1 0 0 1-1.707.707L4.586 13H2a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h2.586l3.707-3.707a1 1 0 0 1 1.09-.217m5.274-.147a1 1 0 0 1 1.414 0A9.97 9.97 0 0 1 19 10a9.97 9.97 0 0 1-2.929 7.071a1 1 0 0 1-1.414-1.414A7.97 7.97 0 0 0 17 10a7.97 7.97 0 0 0-2.343-5.657a1 1 0 0 1 0-1.414m-2.829 2.828a1 1 0 0 1 1.415 0A5.98 5.98 0 0 1 15 10a5.98 5.98 0 0 1-1.757 4.243a1 1 0 0 1-1.415-1.415A3.98 3.98 0 0 0 13 10a3.98 3.98 0 0 0-1.172-2.828a1 1 0 0 1 0-1.415"
          clip-rule="evenodd" />
      </svg>
      <!-- OFF用SVG -->
      <svg id="icon-volume-off" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
        viewBox="0 0 20 20"><!-- Icon from HeroIcons v1 Solid by Refactoring UI Inc - https://github.com/tailwindlabs/heroicons/blob/master/LICENSE -->
        <path fill="currentColor" fill-rule="evenodd"
          d="M9.383 3.076A1 1 0 0 1 10 4v12a1 1 0 0 1-1.707.707L4.586 13H2a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h2.586l3.707-3.707a1 1 0 0 1 1.09-.217m2.91 4.217a1 1 0 0 1 1.414 0L15 8.586l1.293-1.293a1 1 0 1 1 1.414 1.414L16.414 10l1.293 1.293a1 1 0 0 1-1.414 1.414L15 11.414l-1.293 1.293a1 1 0 0 1-1.414-1.414L13.586 10l-1.293-1.293a1 1 0 0 1 0-1.414"
          clip-rule="evenodd" />
      </svg>
    </button>

    <section class="body-font grow">
      <div class="container mx-auto">

        <!-- 最初の挨拶画面 -->
        <div id="koneko-greeting">
          <div class="text-center">
            <div class="text-center">
              <img src="img/koneko.webp" alt="こねこ" class="w-3xs lg:w-xs m-auto rounded-full">
            </div>
            <h1 class="text-3xl 2xl:text-5xl my-2 2xl:my-6 font-bold">
              こねこジャンケン
            </h1>
            <div class="text-base leading-relaxed w-3/4 mt-4 mx-auto description">
              <p class="pb-4">こねこと一緒にじゃんけんしよう！</p>
              <p class="pb-4">
                勝つと猫の足跡（🐾）が1つもらえるよ。<br>
                最初は3個からスタート。<br>0個になったらひとやすみ。</p>
              <p>たくさん勝って足跡（🐾）を<br><strong class="text-2xl px-2">10個</strong>集めよう！！</p>
            </div>
          </div>
          <div class="text-center mt-5 2xl:mt-10">
            <div class="py-6 btn-wrap">
              <button id="start-btn" class="mx-auto text-2xl btn-square">
                はじめる 🐾
              </button>
            </div>
          </div>
        </div>

        <!-- じゃんけんフィールド JSで描画 -->
        <div id="play-field" class="text-center">
          <div id="ready" class="sm:text-5xl text-4xl py-6 md:py-10 font-bold">じゃん、けん</div>
          <div id="janken-btns" class="flex justify-evenly"></div>
          <!-- アイテムボックス -->
          <div id="item-box" class="text-center mt-10">
            <p class="text-sm text-gray-400 mb-4">もちもの</p>
            <div id="item-list" class="flex justify-center flex-wrap gap-4"></div>
          </div>
        </div>



        <!-- 判定画面 -->
        <div id="judge-field">
          <div class="flex flex-col justify-around w-full items-center">
            <!-- 子猫 -->
            <div class="2xl:py-3 flex text-center">
              <div>
                <div class="max-w-3xs flex justify-center">
                  <p id="pc-hands"></p>
                </div>
              </div>
            </div>
            <!-- ここに勝敗を表示 -->
            <div id="judgment" class="py-3 2xl:py-4 2xl:text-5xl text-3xl text-center font-bold"></div>
            <!-- あなた -->
            <div class="pb-4 flex items-center text-center">
              <div>
                <div class="max-w-24 flex justify-center">
                  <p id="my-hands" class="text-7xl 2xl:text-8xl"></p>
                </div>
              </div>
              <div class="2xl:p-4">
                <div id="foot-prints" class="text-3xl 2xl:text-4xl"></div>
                <div id="your-score" class="text-5xl 2xl:text-6xl 2xl:pt-3 font-bold"></div>
              </div>
            </div>
          </div>

          <!-- リトライ -->
          <div id="retry-area" class="text-center">
            <div class="py-6 btn-wrap">
              <button id="retry-btn" class="mx-auto text-2xl btn-square">
                もういちど
              </button>
            </div>
          </div>
        </div>

        <!-- プレゼント -->
        <div id="present-area" class="justify-center text-center">
          <div class="py-6 btn-wrap">
            <button id="present-btn" class="mx-auto text-2xl btn-square">
              プレゼントを見る
            </button>
          </div>
        </div>

        <!-- プレゼント表示＆はじめから -->
        <div id="present-view" class="min-h-0 text-center">
          <div id="random-present" class="my-10"></div>
          <div class="py-6 btn-wrap">
            <button id="return-btn" class="mx-auto text-2xl btn-square">
              はじめから 🐾
            </button>
          </div>
        </div>

      </div>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>

</html>
